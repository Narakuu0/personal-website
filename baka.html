    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .vertical-menu {
            width: 200px;
            background-color: #f1f1f1;
            list-style-type: none;
            margin: 0;
            padding: 0;
            position: relative; /* 确保子菜单相对于父菜单定位 */
        }

        .vertical-menu > li > a {
            background-color: #7db3fa;
            color: white;
            display: block;
            padding: 12px;
            text-decoration: none;
            text-align: left;
        }

        .vertical-menu > li > a:hover {
            background-color: #7db3fa;
        }

        .vertical-menu li ul {
            display: none; /* 默认隐藏子菜单 */
            list-style-type: none;
            margin: 0;
            padding: 0;
            position: absolute; /* 使用绝对定位 */
            width: 200px;
            background-color: #f1f1f1;
            left: 0; /* 子菜单与父菜单对齐 */
            z-index: 1; /* 确保子菜单在其他内容之上 */
        }

        .vertical-menu li ul li a {
            background-color: #f1f1f1;
            color: black;
            display: block;
            padding: 12px;
            text-decoration: none;
            text-align: left;
        }

        .vertical-menu li ul li a:hover {
            background-color: #ddd;
        }

        /* 使用JavaScript控制点击事件 */
        .vertical-menu li:hover ul {
            display: block;
        }

        .hidden-content {
            display: none; /* 默认隐藏内容 */
        }

        .form-container {
            margin: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            width: 300px;
        }

        .form-container input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        .form-container input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #7db3fa;
            color: white;
            border: none;
            cursor: pointer;
        }

        .form-container input[type="submit"]:hover {
            background-color: #7db3fa;
        }

        .error-message {
            color: red;
            display: none; /* 默认隐藏错误消息 */
        }

        .carousel {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            overflow: hidden;
        }

        .carousel img {
            width: 100%;
            height: 100%; /* 设置固定高度 */
            object-fit: cover; /* 保持图片的宽高比并裁剪 */
            display: none; /* 默认隐藏所有图片 */
        }

        .carousel img.active {
            display: block; /* 显示当前活动图片 */
        }

        .carousel-controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
        }

        .carousel-controls button {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 5px 10px;
            margin: 0 5px;
            cursor: pointer;
            border-radius: 50%;
            transition: background-color 0.3s;
        }

        .carousel-controls button:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        .carousel-dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
        }

        .carousel-dots button {
            background-color: rgba(255, 255, 255, 0.5);
            border: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin: 0 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .carousel-dots button.active {
            background-color: white;
        }

        /* 长型轮播框样式 */
        .carousel-wide {
            max-width: 600px; /* 设置长型轮播框的最大宽度 */
            height: 400px; /* 设置长型轮播框的高度 */
        }

        /* 高型轮播框样式 */
        .carousel-high {
            max-width: 400px; /* 设置宽型轮播框的最大宽度 */
            height: 600px; /* 设置宽型轮播框的高度 */
        }

         /* 响应式设计 */
         @media (max-width: 600px) {
            .carousel img {
                object-fit: contain; /* 保持图片的宽高比并完整显示 */
            }

            .carousel-controls {
                bottom: 5px;
            }

            .carousel-dots {
                bottom: 5px;
            }
        }

        @media (max-width: 400px) {
            .carousel-long, .carousel-wide {
                height: 200px; /* 适应更小的屏幕 */
            }

            .carousel-controls button {
                padding: 3px 6px;
            }

            .carousel-dots button {
                width: 8px;
                height: 8px;
            }
        }
    </style>

    <script>
        document.querySelectorAll('.dropdown-toggle').forEach(item => {
            item.addEventListener('click', event => {
                event.preventDefault();
                const dropdownMenu = item.nextElementSibling;
                if (dropdownMenu.style.display === 'block') {
                    dropdownMenu.style.display = 'none';
                } else {
                    dropdownMenu.style.display = 'block';
                }
            });
        });

        // 点击菜单外区域时隐藏子菜单
        window.addEventListener('click', function(event) {
            if (!event.target.matches('.dropdown-toggle')) {
                document.querySelectorAll('.dropdown-menu').forEach(item => {
                    if (item.style.display === 'block') {
                        item.style.display = 'none';
                    }
                });
            }
        });
    </script>

            <script>
                function showImage(carouselId, index) {
                    const images = document.querySelectorAll(`#${carouselId} img`);
                    const dots = document.querySelectorAll(`#${carouselId} .carousel-dots button`);

                    images.forEach((img, i) => {
                        img.classList.remove('active');
                        if (i === index) {
                            img.classList.add('active');
                        }
                    });

                    dots.forEach((dot, i) => {
                        dot.classList.remove('active');
                        if (i === index) {
                            dot.classList.add('active');
                        }
                    });
                }

                function nextImage(carouselId) {
                    const images = document.querySelectorAll(`#${carouselId} img`);
                    let currentIndex = Array.from(images).findIndex(img => img.classList.contains('active'));
                    currentIndex = (currentIndex + 1) % images.length;
                    showImage(carouselId, currentIndex);
                }

                function prevImage(carouselId) {
                    const images = document.querySelectorAll(`#${carouselId} img`);
                    let currentIndex = Array.from(images).findIndex(img => img.classList.contains('active'));
                    currentIndex = (currentIndex - 1 + images.length) % images.length;
                    showImage(carouselId, currentIndex);
                }

                // 自动轮播
                setInterval(() => nextImage('carousel1'), 3000); // 每3秒切换一次图片
                setInterval(() => nextImage('carousel2'), 3000); // 每3秒切换一次图片

                setInterval(() => nextImage('carousel6'), 3000);

            </script>

            <!--触摸滑动功能-->
            <script>
                document.querySelectorAll('.carousel').forEach(carousel => {
                    let startX, startY, moveX, moveY, deltaX, deltaY;

                    carousel.addEventListener('touchstart', function(event) {
                        startX = event.touches[0].clientX;
                        startY = event.touches[0].clientY;
                    });

                    carousel.addEventListener('touchmove', function(event) {
                        moveX = event.touches[0].clientX;
                        moveY = event.touches[0].clientY;
                        deltaX = moveX - startX;
                        deltaY = moveY - startY;
                    });

                    carousel.addEventListener('touchend', function(event) {
                        if (Math.abs(deltaX) > Math.abs(deltaY)) { // 水平滑动
                            if (deltaX > 0) { // 向右滑动
                                prevImage(carousel.id);
                            } else { // 向左滑动
                                nextImage(carousel.id);
                            }
                        }
                    });
                });
