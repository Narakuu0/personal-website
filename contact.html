    <style>
        /* 导航栏 */
        .navbar {
            height: 40px;
            background-color: #7db3fa;
            box-shadow: 0 2px 5px #666;
        }
        
        /*去掉不必要*/
        * {
            margin: 0;
            padding: 0;
            text-decoration: none;
            list-style: none;
        }

        /* 导航栏列表 */
        .navlist a{
            color: white;
            display: block;
            padding: 0 30px;
            line-height: 40px;
        }

        /* 导航栏列表鼠标悬停 */
        .navlist a:hover{
            color: #ffffff;
            background-color: #519afa;
        }

        /* 导航栏项目 */
        .navitem {
            float: left;/* 左浮动 */
            width: 150px ;/* 宽度 */
            line-height: 80px;/* 行高 */
            text-align: center;/* 居中 */
            font-size: 18px ;;/* 字体大小 */
        }

        /* 导航栏下拉列表 */
        .droplist {
            background-color: #7db3fa;
            box-shadow: 0 4px 4px #666;
            display: none;
            position:absolute;/* 绝对定位 */
            width: 150px;
            padding: 0;
            margin: 0;
        }

        /* 悬停时下拉列表项目 */
        .navitem:hover .droplist {
            display: block;
        }

        .hidden-content {
            display: none; /* 默认隐藏内容 */
        }

        .form-container {
            margin: 20px;
            padding: 20px;
            border: 1px solid #ccc;
            width: 300px;
        }

        .form-container input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        .form-container input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #7db3fa;
            color: white;
            border: none;
            cursor: pointer;
        }

        .form-container input[type="submit"]:hover {
            background-color: #7db3fa;
        }

        .error-message {
            color: red;
            display: none; /* 默认隐藏错误消息 */
        }
    </style>
</head>
