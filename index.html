<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narakuu小站</title>
    <style>
        /* 导航栏 */
        .navbar {
            height: 40px;
            background-color: #7db3fa;
            box-shadow: 0 2px 5px #666;
        }
        
        /*去掉不必要*/
        * {
            margin: 0;
            padding: 0;
            text-decoration: none;
            list-style: none;
        }

        /* 导航栏列表 */
        .navlist a{
            color: white;
            display: block;
            padding: 0 30px;
            line-height: 40px;
        }

        /* 导航栏列表鼠标悬停 */
        .navlist a:hover{
            color: #ffffff;
            background-color: #519afa;
        }

        /* 导航栏项目 */
        .navitem {
            float: left;/* 左浮动 */
            width: 150px ;/* 宽度 */
            line-height: 80px;/* 行高 */
            text-align: center;/* 居中 */
            font-size: 18px ;;/* 字体大小 */
        }

        /* 导航栏下拉列表 */
        .droplist {
            background-color: #7db3fa;
            box-shadow: 0 4px 4px #666;
            display: none;
            position:absolute;/* 绝对定位 */
            width: 150px;
            padding: 0;
            margin: 0;
        }

        /* 悬停时下拉列表项目 */
        .navitem:hover .droplist {
            display: block;
        }

        /* 轮播框样式 */
        .carousel {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            overflow: hidden;
        }
        
        /* 轮播框图片 */
        .carousel img {
            width: 100%;
            height: 100%; /* 设置固定高度 */
            object-fit: cover; /* 保持图片的宽高比并裁剪 */
            display: none; /* 默认隐藏所有图片 */
        }
        
        /* 轮播框控制按钮 */
        .carousel img.active {
            display: block; /* 显示当前活动图片 */
        }
        
        /* 轮播框左右按钮 */
        .carousel-controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
        }
        
        /* 轮播框左右按钮 */
        .carousel-controls button {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 5px 10px;
            margin: 0 5px;
            cursor: pointer;
            border-radius: 50%;
            transition: background-color 0.3s;
        }
        
        /* 轮播框左右按钮悬停 */
        .carousel-controls button:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
        
        /* 轮播框指示器 */
        .carousel-dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
        }

        /* 增加媒体查询以适应手机端 */
        @media (max-width: 600px) {
            .carousel-dots {
                width: 100%; /* 或者根据需要调整宽度 */
                justify-content: space-around; /* 可以尝试不同的justify-content值 */
                padding: 0 10px; /* 增加一些内边距以防止指示器贴边 */
            }
        }
        
        /* 轮播框指示器按钮 */
        .carousel-dots button {
            background-color: rgba(255, 255, 255, 0.5);
            border: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin: 0 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        /* 轮播框指示器按钮悬停 */
        .carousel-dots button.active {
            background-color: white;
        }

        /* 长型轮播框样式 */
        .carousel-wide {
            max-width: 600px; /* 设置长型轮播框的最大宽度 */
            height: 400px; /* 设置长型轮播框的高度 */
        }

        /* 高型轮播框样式 */
        .carousel-high {
            max-width: 400px; /* 设置宽型轮播框的最大宽度 */
            height: 600px; /* 设置宽型轮播框的高度 */
        }

         /* 响应式设计 */
         @media (max-width: 600px) {
            .carousel img {
                object-fit: contain; /* 保持图片的宽高比并完整显示 */
            }

            .carousel-controls {
                bottom: 5px;
            }

            .carousel-dots {
                bottom: 5px;
            }
        }

        @media (max-width: 400px) {
            .carousel-long, .carousel-wide {
                height: 200px; /* 适应更小的屏幕 */
            }

            .carousel-controls button {
                padding: 3px 6px;
            }

            .carousel-dots button {
                width: 8px;
                height: 8px;
            }
        }
    </style>
</head>
<body>

    <!-- 这是AI写的，我不知道有什么用，好像去掉也不影响功能实现？？？ -->
    <script>
        document.querySelectorAll('.dropdown-toggle').forEach(item => {
            item.addEventListener('click', event => {
                event.preventDefault();
                const dropdownMenu = item.nextElementSibling;
                if (dropdownMenu.style.display === 'block') {
                    dropdownMenu.style.display = 'none';
                } else {
                    dropdownMenu.style.display = 'block';
                }
            });
        });

        // 点击菜单外区域时隐藏子菜单
        window.addEventListener('click', function(event) {
            if (!event.target.matches('.dropdown-toggle')) {
                document.querySelectorAll('.dropdown-menu').forEach(item => {
                    if (item.style.display === 'block') {
                        item.style.display = 'none';
                    }
                });
            }
        });
    </script>

    <!-- 内容 -->
    <div style="
    background-color: #ffffff;
    font-size: 16px;
    max-width: 760px;
    padding: 15px;
    margin: 30px auto;
    line-height: 1.7;
    ">
        <h2 style="
        color:#7db3fa;
        ">首页</h2>
        <p>欢迎来到Narakuu小站!</p>
        <p>这里是Naraku的个人网站!</p>
        <img src="https://i.imgs.ovh/2025/05/01/rbpWx.png" alt="rbpWx.png" style=" width: 100%;"/>
        
        <!-- 第一个轮播框 宽-->
        <div class="carousel carousel-wide" id="carousel1">
            <img src="https://i.imgs.ovh/2025/05/01/rkbLn.jpeg" alt="图片1" class="active">
            <img src="https://i.imgs.ovh/2025/05/01/rkUw1.jpeg" alt="图片2">
            <img src="https://i.imgs.ovh/2025/05/01/rkTJb.jpeg" alt="图片3">
            <img src="https://i.imgs.ovh/2025/05/01/rkLAY.jpeg" alt="图片4">
            <div class="carousel-controls">
                <button onclick="prevImage('carousel1')">‹</button>
                <button onclick="nextImage('carousel1')">›</button>
            </div>

            <div class="carousel-dots">
                <button onclick="showImage('carousel1', 0)" class="active"></button>
                <button onclick="showImage('carousel1', 1)"></button>
                <button onclick="showImage('carousel1', 2)"></button>
                <button onclick="showImage('carousel1', 3)"></button>
            </div>
        </div>

        <script>
            function showImage(carouselId, index) {
                const images = document.querySelectorAll(`#${carouselId} img`);
                const dots = document.querySelectorAll(`#${carouselId} .carousel-dots button`);

                images.forEach((img, i) => {
                    img.classList.remove('active');
                    if (i === index) {
                        img.classList.add('active');
                    }
                });

                dots.forEach((dot, i) => {
                    dot.classList.remove('active');
                    if (i === index) {
                        dot.classList.add('active');
                    }
                });
            }

            function nextImage(carouselId) {
                const images = document.querySelectorAll(`#${carouselId} img`);
                let currentIndex = Array.from(images).findIndex(img => img.classList.contains('active'));
                currentIndex = (currentIndex + 1) % images.length;
                showImage(carouselId, currentIndex);
            }

            function prevImage(carouselId) {
                const images = document.querySelectorAll(`#${carouselId} img`);
                let currentIndex = Array.from(images).findIndex(img => img.classList.contains('active'));
                currentIndex = (currentIndex - 1 + images.length) % images.length;
                showImage(carouselId, currentIndex);
            }

            // 自动轮播
            setInterval(() => nextImage('carousel1'), 3000); 
        </script>

        <!--触摸滑动功能-->
        <script>
            document.querySelectorAll('.carousel').forEach(carousel => {
                let startX, startY, moveX, moveY, deltaX, deltaY;

                carousel.addEventListener('touchstart', function(event) {
                    startX = event.touches[0].clientX;
                    startY = event.touches[0].clientY;
                });

                carousel.addEventListener('touchmove', function(event) {
                    moveX = event.touches[0].clientX;
                    moveY = event.touches[0].clientY;
                    deltaX = moveX - startX;
                    deltaY = moveY - startY;
                });

                carousel.addEventListener('touchend', function(event) {
                    if (Math.abs(deltaX) > Math.abs(deltaY)) { // 水平滑动
                        if (deltaX > 0) { // 向右滑动
                            prevImage(carousel.id);
                        } else { // 向左滑动
                            nextImage(carousel.id);
                        }
                    }
                });
            });
        </script>
