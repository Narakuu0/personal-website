    <!-- 引入CSS文件 -->
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .vertical-menu {
            width: 200px;
            background-color: #f1f1f1;
            list-style-type: none;
            margin: 0;
            padding: 0;
            position: relative; /* 确保子菜单相对于父菜单定位 */
        }

        .vertical-menu > li > a {
            background-color: #7db3fa;
            color: white;
            display: block;
            padding: 12px;
            text-decoration: none;
            text-align: left;
        }

        .vertical-menu > li > a:hover {
            background-color: #7db3fa;
        }

        .vertical-menu li ul {
            display: none; /* 默认隐藏子菜单 */
            list-style-type: none;
            margin: 0;
            padding: 0;
            position: absolute; /* 使用绝对定位 */
            width: 200px;
            background-color: #f1f1f1;
            left: 0; /* 子菜单与父菜单对齐 */
            z-index: 1; /* 确保子菜单在其他内容之上 */
        }

        .vertical-menu li ul li a {
            background-color: #f1f1f1;
            color: black;
            display: block;
            padding: 12px;
            text-decoration: none;
            text-align: left;
        }

        .vertical-menu li ul li a:hover {
            background-color: #ddd;
        }

        /* 使用JavaScript控制点击事件 */
        .vertical-menu li:hover ul {
            display: block;
        }
    </style>
</head>
<body>
    
    <div style="position: relative; width: 100%; ;">
        <ul class="vertical-menu">
            
            <li>
                <a href="#" class="dropdown-toggle">MENU~~</a>
                <ul class="dropdown-menu">
                    <li><a href="https://narakuu0.github.io/personal-website/">回到主页</a></li>
                    <li><a href="https://narakuu0.github.io/personal-website/self-info">自我介绍</a></li>
                    <li><a href="https://narakuu0.github.io/personal-website/contact">联系方式</a></li>
                    <li><a href="https://narakuu0.github.io/personal-website/baka">神秘小世界</a></li>
                </ul>
            </li>
            
        </ul>
        
        
    </div>

    <script>
        document.querySelectorAll('.dropdown-toggle').forEach(item => {
            item.addEventListener('click', event => {
                event.preventDefault();
                const dropdownMenu = item.nextElementSibling;
                if (dropdownMenu.style.display === 'block') {
                    dropdownMenu.style.display = 'none';
                } else {
                    dropdownMenu.style.display = 'block';
                }
            });
        });

        // 点击菜单外区域时隐藏子菜单
        window.addEventListener('click', function(event) {
            if (!event.target.matches('.dropdown-toggle')) {
                document.querySelectorAll('.dropdown-menu').forEach(item => {
                    if (item.style.display === 'block') {
                        item.style.display = 'none';
                    }
                });
            }
        });
    </script>
