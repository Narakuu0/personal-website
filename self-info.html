    <style>
        /* 导航栏 */
        .navbar {
            height: 40px;
            background-color: #7db3fa;
            box-shadow: 0 2px 5px #666;
        }
        
        /*去掉不必要*/
        * {
            margin: 0;
            padding: 0;
            text-decoration: none;
            list-style: none;
        }

        /* 导航栏列表 */
        .navlist a{
            color: white;
            display: block;
            padding: 0 30px;
            line-height: 40px;
        }

        /* 导航栏列表鼠标悬停 */
        .navlist a:hover{
            color: #ffffff;
            background-color: #519afa;
        }

        /* 导航栏项目 */
        .navitem {
            float: left;/* 左浮动 */
            width: 150px ;/* 宽度 */
            line-height: 80px;/* 行高 */
            text-align: center;/* 居中 */
            font-size: 18px ;;/* 字体大小 */
        }

        /* 导航栏下拉列表 */
        .droplist {
            background-color: #7db3fa;
            box-shadow: 0 4px 4px #666;
            display: none;
            position:absolute;/* 绝对定位 */
            width: 150px;
            padding: 0;
            margin: 0;
        }

        /* 悬停时下拉列表项目 */
        .navitem:hover .droplist {
            display: block;
        }
        
        /* 图片容器 */
        .image-container {
            display: flex; /* 使用flex布局 */
            justify-content: center; /* 水平居中对齐 */
            align-items: center; /* 垂直居中对齐 */
            margin: 20px; /* 外边距 */
        }

        /* 图片样式 */
        .image-container img {
            margin: 0 10px; /* 图片之间的间距 */
            max-width: 100%; /* 确保图片不会超出容器宽度 */
            height: auto; /* 保持图片的宽高比 */
        }
    </style>
</head>
